name: CI

# CI untuk safekids (repo #51 — Vite + React Three Fiber + Supabase).
# Job:
#   build          — npm ci + tsc + vite build, dist diunggah sebagai artifact.
#   typecheck      — tsc --noEmit terpisah.
#   lint           — eslint . (0 error; 30 warning utang teknis, lihat docs/TESTING.md §4).
#   advisory-sweep — OSV atas 15 dependensi produksi, tanpa auth — HIGH/CRITICAL = gagal.
#   static-checks  — gate P0 anti-slop + tag OG/Twitter + og-image 1200×630.
#   playwright-e2e — landing + alur utama (desktop + Pixel 7).
#   gitleaks       — secret scan riwayat penuh (fetch-depth 0) + .gitleaks.toml.
#   smoke          — file yang di-deploy ada & tidak kosong (dari artifact build).
# Node 20 (Vite 5 butuh >= 18; Node 24 juga bisa, tapi 20 adalah LTS yang
# dipakai lockfile ini saat dibuat).
# Lockfile ADA (package-lock.json) → CI memakai `npm ci` + `cache: npm`.
# JANGAN `npx playwright install` di VM dev — hanya di CI.
# JANGAN pakai `| tee` tanpa pipefail di step CI (pelajaran #44: tee
# menutupi exit code gagal jadi tampak hijau).
# JANGAN pakai `npm audit` sebagai gate (gagal deterministik pada advisory
# dev-only); advisory-sweep.py yang menjadi gate produksi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build: tsc + vite build ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Unggah dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # ── Typecheck terpisah ──────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: eslint .
        run: npm run lint

  # ── Advisory sweep (OSV, tanpa auth) ────────────────────────────────────
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep 15 dependensi produksi di OSV
        run: python3 scripts/advisory-sweep.py

  # ── Pemeriksaan statis: gate P0 + tag OG ────────────────────────────────
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gate P0 + tag OG/Twitter + aset
        run: node scripts/check-static.mjs

  # ── E2E Playwright (landing + alur utama, HANYA di CI) ─────────────────
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E landing (desktop + mobile Pixel 7)
        run: npm run e2e

      # Media capture README (e2e/media-capture.spec.ts): screenshot adegan
      # kunci ke media-capture/ + video Playwright (.webm) -> demo.mp4.
      # Artifact `readme-media` diunduh lalu di-commit ke docs/ (README).
      # ffmpeg: urutan — (1) ffmpeg sistem; (2) static build johnvansickle
      # (full, ber-libx264); (3) apt sebagai jalan terakhir. JANGAN pakai
      # bundle Playwright (~/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux):
      # itu build MINIMAL (--disable-everything, tanpa libx264 dan tanpa
      # muxer mp4) — konversi gagal exit 8 (happy-birthday-mama run
      # 44534655548). apt saja pernah gagal exit 124 (install menggantung
      # sampai `timeout 240`, run 44532868828).
      # timeout-minutes: apt-get update pernah menggantung >10 menit di
      # runner (run 44528716237) — jangan biarkan satu step menahan job.
      - name: Convert walkthrough video to MP4
        if: always()
        timeout-minutes: 8
        run: |
          set -euo pipefail
          FFMPEG="$(command -v ffmpeg || true)"
          if [ -z "$FFMPEG" ] || ! "$FFMPEG" -hide_banner -encoders 2>/dev/null | grep -q ' libx264 '; then
            echo "ffmpeg sistem tidak ada / tanpa libx264 — unduh static build johnvansickle"
            curl -fsSL --max-time 120 -o /tmp/ffmpeg-static.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              && tar -xJf /tmp/ffmpeg-static.tar.xz -C /tmp \
              && FFMPEG="$(ls -d /tmp/ffmpeg-*-amd64-static/ffmpeg 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$FFMPEG" ] || ! "$FFMPEG" -hide_banner -encoders 2>/dev/null | grep -q ' libx264 '; then
            echo "static build gagal — coba apt"
            sudo timeout 120 apt-get update -qq || true
            sudo timeout 240 apt-get install -y -qq ffmpeg || true
            FFMPEG="$(command -v ffmpeg || true)"
          fi
          test -n "$FFMPEG" && "$FFMPEG" -hide_banner -encoders 2>/dev/null | grep -q ' libx264 ' || { echo "FAIL: ffmpeg ber-libx264 tidak tersedia"; exit 1; }
          echo "ffmpeg: $FFMPEG"
          # Pilih video TERBESAR: tes yang di-skip (mobile) juga menghasilkan
          # file video.webm stub ~1 detik — `find -print -quit` pernah
          # mengambil stub itu (run 44532434947: demo.mp4 cuma 1 detik).
          VIDEO=$(find test-results -name 'video.webm' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          test -n "$VIDEO" || { echo "FAIL: video.webm tidak ditemukan di test-results/"; find test-results -type f | head -20; exit 1; }
          echo "video sumber: $VIDEO ($(stat -c%s "$VIDEO") byte)"
          mkdir -p media-capture
          "$FFMPEG" -y -i "$VIDEO" -c:v libx264 -pix_fmt yuv420p -movflags +faststart media-capture/demo.mp4
          "$FFMPEG" -hide_banner -i media-capture/demo.mp4 2>&1 | grep -E 'Duration|Video:' || true
          SIZE=$(stat -c%s media-capture/demo.mp4)
          echo "demo.mp4: ${SIZE} byte"
          test "$SIZE" -ge 100000 || { echo "FAIL: demo.mp4 terlalu kecil (< 100 KB) — kemungkinan stub video tes skip"; exit 1; }
          DUR=$("$FFMPEG" -hide_banner -i media-capture/demo.mp4 2>&1 | grep -o 'Duration: [0-9:.]*' | cut -d' ' -f2 || true)
          test -n "$DUR" || { echo "FAIL: durasi demo.mp4 tidak terbaca"; exit 1; }
          DURSEC=$(echo "$DUR" | awk -F: '{ split($3, a, "."); print $1*3600 + $2*60 + a[1] }')
          echo "durasi demo.mp4: ${DUR} (${DURSEC} detik)"
          test "$DURSEC" -ge 5 || { echo "FAIL: demo.mp4 terlalu pendek (< 5 detik)"; exit 1; }
          ls -la media-capture/

      - name: Upload readme media (screenshots + demo video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-media
          path: media-capture/
          if-no-files-found: error

      - name: Unggah trace saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: warn

  # ── Gitleaks: secret scan riwayat penuh ─────────────────────────────────
  # Bukan gitleaks-action: binary resmi diunduh langsung dan dijalankan
  # dengan --config eksplisit. Riwayat sudah di-rewrite (P3, 18 Nov 2026)
  # dan terverifikasi nol file .env; scan lokal 19 Nov 2026: no leaks found.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.28.0
        run: |
          set -euo pipefail
          curl -sL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Gitleaks (riwayat penuh, config repo)
        run: /tmp/gitleaks git --no-banner --config .gitleaks.toml

  # ── Smoke: file deploy ada & tidak kosong ───────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Unduh dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: File deploy ada & tidak kosong
        run: |
          set -euo pipefail
          for f in dist/index.html dist/og-image.png dist/compass.svg dist/_redirects; do
            test -s "$f" || { echo "HILANG/KOSONG: $f"; exit 1; }
            echo "OK: $f ($(stat -c%s "$f") byte)"
          done
          grep -q 'og:image' dist/index.html || { echo "tag og:image hilang dari dist/index.html"; exit 1; }
          grep -q 'twitter:card' dist/index.html || { echo "tag twitter:card hilang dari dist/index.html"; exit 1; }
          echo "smoke: OK"
